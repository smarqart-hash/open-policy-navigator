name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    # Draft pull requests are checked locally; CI starts at "Ready for review".
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # Eval ratchet: fails if a metric falls below eval/thresholds.json
      - run: python -m keine_alternative.evaluation --check
