<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="title">Wo Wirkung gemessen wurde und wo nicht</title>
<desc id="desc">Ein Kästchen je Fall, je Teilfrage eine Zeile. Wer trägt das Risiko, wenn KI Arbeit verändert?: 6 von 10 mit Messung; Wer setzt die Löhne in Branchen unter Druck?: 1 von 1 mit Messung; Wie viel Regel brauchen KI-Märkte?: 3 von 9 mit Messung; Wer entscheidet, wie KI im Betrieb eingesetzt wird?: 1 von 6 mit Messung. Zusammen 11 von 26.</desc>
